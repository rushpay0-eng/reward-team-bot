<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lucky Wheel</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>🎡 Lucky Wheel</h1><p>Spin karke confirmed reward unlock karein</p><div class="wheelbox"><div class="pointer">▼</div><canvas id="w" width="340" height="340"></canvas></div><button id="spin">SPIN NOW</button><div id="result"></div></main><script>
Telegram.WebApp.ready();Telegram.WebApp.expand();const vals=[50,100,200,300,400,500],cols=['#ffca28','#ff6b6b','#2ed6c7','#7c5cff','#ff9f43','#3d9cff'],c=document.getElementById('w'),x=c.getContext('2d'),arc=Math.PI*2/6;let rot=0,busy=false;function draw(){x.clearRect(0,0,340,340);x.save();x.translate(170,170);x.rotate(rot);vals.forEach((v,i)=>{x.beginPath();x.moveTo(0,0);x.arc(0,0,158,i*arc,(i+1)*arc);x.closePath();x.fillStyle=cols[i];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.save();x.rotate(i*arc+arc/2);x.translate(105,0);x.rotate(Math.PI/2);x.fillStyle='#fff';x.font='bold 22px Arial';x.textAlign='center';x.fillText('₹'+v,0,7);x.restore()});x.beginPath();x.arc(0,0,34,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.fillStyle='#222';x.font='bold 12px Arial';x.textAlign='center';x.fillText('LUCKY',0,4);x.restore()}draw();document.getElementById('spin').onclick=async()=>{if(busy)return;busy=true;let b=document.getElementById('spin');b.disabled=true;b.textContent='SPINNING...';let r=await fetch('/api/wheel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'{{token}}'})}),d=await r.json(),idx=vals.indexOf(d.reward),target=Math.PI*1.5-(idx*arc+arc/2)+Math.PI*14,start=rot,t0=performance.now();function a(t){let p=Math.min((t-t0)/4500,1),e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(a);else{document.getElementById('result').innerHTML=`<div class="success big">🎉 You won ₹${d.reward}</div>`;b.textContent='COMPLETED'}}requestAnimationFrame(a)};
</script></body></html>
