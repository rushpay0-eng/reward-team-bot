
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Lucky Wheel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/miniapp.css">
</head>
<body>
<main class="mini-page">
  <div class="mini-brand">UPI TASK REWARDS</div>
  <h1>🎡 Lucky Wheel</h1>
  <p class="muted">Spin once to reveal your reward.</p>

  <div class="wheel-wrap">
    <div class="pointer">▼</div>
    <canvas id="wheelCanvas" width="360" height="360"></canvas>
  </div>

  <button id="spinButton" class="primary" {% if already_used %}disabled{% endif %}>
    {% if already_used %}Already Used{% else %}Spin Now{% endif %}
  </button>
  <button id="backButton" class="secondary">⬅️ Return to Bot</button>
  <div id="resultBox">
    {% if already_used %}
      <div class="success">Your Lucky Wheel reward was ₹{{ existing_reward }}.</div>
    {% endif %}
  </div>
</main>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const values = {{ values | tojson }};
const palette = ['#ffcb3d','#ff6b6b','#4ecdc4','#775cff','#ff9f43','#4d96ff','#26c281','#f368e0'];
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const spinButton = document.getElementById('spinButton');
const centre = canvas.width / 2;
const radius = centre - 10;
const arc = Math.PI * 2 / values.length;
let rotation = 0;
let spinning = false;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(centre, centre);
  ctx.rotate(rotation);

  values.forEach((value, index) => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, index * arc, (index + 1) * arc);
    ctx.closePath();
    ctx.fillStyle = palette[index % palette.length];
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.rotate(index * arc + arc / 2);
    ctx.translate(radius * .66, 0);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('₹' + value, 0, 8);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(0, 0, 36, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.fillStyle = '#20202b';
  ctx.font = '700 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('LUCKY', 0, 5);
  ctx.restore();
}
draw();

spinButton.onclick = async () => {
  if (spinning) return;
  spinning = true;
  spinButton.disabled = true;
  spinButton.textContent = 'Spinning...';

  try {
    const response = await fetch('/api/wheel', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: '{{ token }}'})
    });
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || 'Unable to spin');

    const index = values.indexOf(data.reward);
    const target = Math.PI * 1.5 - (index * arc + arc / 2);
    const start = rotation;
    const end = target + Math.PI * 2 * 7;
    const duration = 4500;
    const startTime = performance.now();

    function animate(time) {
      const progress = Math.min((time - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 4);
      rotation = start + (end - start) * eased;
      draw();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        spinButton.textContent = 'Completed';
        document.getElementById('resultBox').innerHTML =
          `<div class="success">🎉 You won ₹${data.reward}.<br>Your updated dashboard has been sent to the bot. Tap Return to Bot to continue.</div>`;
        tg.HapticFeedback.notificationOccurred('success');
      }
    }
    requestAnimationFrame(animate);
  } catch (error) {
    spinning = false;
    spinButton.disabled = false;
    spinButton.textContent = 'Try Again';
    document.getElementById('resultBox').innerHTML =
      `<div class="error">${error.message}</div>`;
  }
};

document.getElementById('backButton').onclick = () => tg.close();
</script>
</body>
</html>
