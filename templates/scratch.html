
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Scratch Card</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/miniapp.css">
</head>
<body>
<main class="mini-page">
  <div class="mini-brand">UPI TASK REWARDS</div>
  <h1>🎁 Lucky Scratch</h1>
  <p class="muted">Scratch the silver layer to reveal your reward.</p>

  <section class="scratch-card">
    <div class="prize-panel">
      <span>YOU WON</span>
      <strong>₹{{ reward }}</strong>
      <small>Reward unlocked</small>
    </div>
    <canvas id="scratchCanvas"></canvas>
  </section>

  <p id="statusText" class="muted">
    {% if already_claimed %}This reward has already been claimed.{% else %}Scratch at least 45% to continue.{% endif %}
  </p>

  <button id="claimButton" class="primary" disabled>
    {% if already_claimed %}Already Claimed{% else %}Claim Reward{% endif %}
  </button>
  <button id="backButton" class="secondary">⬅️ Return to Bot</button>
  <div id="resultBox"></div>
</main>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const alreadyClaimed = {{ 'true' if already_claimed else 'false' }};
const canvas = document.getElementById('scratchCanvas');
const container = document.querySelector('.scratch-card');
const ctx = canvas.getContext('2d', {willReadFrequently: true});
const claimButton = document.getElementById('claimButton');
let drawing = false;
let revealed = alreadyClaimed;

function resizeCanvas() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  if (!alreadyClaimed) {
    ctx.globalCompositeOperation = 'source-over';
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#f4f4f4');
    gradient.addColorStop(.45, '#8b8b8b');
    gradient.addColorStop(1, '#dedede');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#252525';
    ctx.font = '700 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('SCRATCH HERE', canvas.width / 2, canvas.height / 2);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
resizeCanvas();

function point(event) {
  const rect = canvas.getBoundingClientRect();
  const source = event.touches ? event.touches[0] : event;
  return {x: source.clientX - rect.left, y: source.clientY - rect.top};
}

function scratch(event) {
  if (!drawing || revealed) return;
  event.preventDefault();
  const p = point(event);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
  ctx.fill();
}

function checkProgress() {
  const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let clear = 0;
  let checked = 0;
  for (let i = 3; i < pixels.length; i += 40) {
    checked++;
    if (pixels[i] === 0) clear++;
  }
  if (clear / checked >= .45 && !revealed) {
    revealed = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    claimButton.disabled = false;
    document.getElementById('statusText').textContent = 'Reward revealed. Claim it now.';
  }
}

if (!alreadyClaimed) {
  ['mousedown', 'touchstart'].forEach(name =>
    canvas.addEventListener(name, event => {drawing = true; scratch(event);})
  );
  ['mousemove', 'touchmove'].forEach(name =>
    canvas.addEventListener(name, scratch, {passive: false})
  );
  ['mouseup', 'mouseleave', 'touchend'].forEach(name =>
    canvas.addEventListener(name, () => {drawing = false; checkProgress();})
  );
}

claimButton.onclick = async () => {
  claimButton.disabled = true;
  claimButton.textContent = 'Claiming...';
  try {
    const response = await fetch('/api/scratch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: '{{ token }}', stage: {{ stage }}})
    });
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || 'Unable to claim reward');

    claimButton.textContent = data.already ? 'Already Claimed' : 'Reward Claimed';
    document.getElementById('resultBox').innerHTML =
      `<div class="success">✅ ₹${data.reward} has been added to your balance.<br>Your updated dashboard has been sent to the bot. Tap Return to Bot to continue.</div>`;
    tg.HapticFeedback.notificationOccurred('success');
  } catch (error) {
    claimButton.disabled = false;
    claimButton.textContent = 'Try Again';
    document.getElementById('resultBox').innerHTML =
      `<div class="error">${error.message}</div>`;
  }
};

document.getElementById('backButton').onclick = () => tg.close();
</script>
</body>
</html>
