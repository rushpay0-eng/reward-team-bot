<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Scratch Card</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>🎁 Lucky Scratch Card</h1><p>Finger se silver layer scratch karein</p><div class="scratch"><div class="prize"><span>YOU WON</span><strong>₹{{reward}}</strong><small>Congratulations!</small></div><canvas id="c"></canvas></div><p id="msg">Scratch to reveal</p><button id="claim" disabled>Claim Reward</button><div id="result"></div></main><script>
Telegram.WebApp.ready();Telegram.WebApp.expand();const c=document.getElementById('c'),box=document.querySelector('.scratch'),x=c.getContext('2d',{willReadFrequently:true});let down=false,done=false;c.width=box.clientWidth;c.height=box.clientHeight;let g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#eee');g.addColorStop(.5,'#777');g.addColorStop(1,'#ddd');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#222';x.font='bold 24px Arial';x.textAlign='center';x.fillText('SCRATCH HERE',c.width/2,c.height/2);
function p(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}function move(e){if(!down||done)return;e.preventDefault();let q=p(e);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(q.x,q.y,25,0,Math.PI*2);x.fill()}function check(){let d=x.getImageData(0,0,c.width,c.height).data,z=0,n=0;for(let i=3;i<d.length;i+=40){n++;if(d[i]===0)z++}if(z/n>.42&&!done){done=true;x.clearRect(0,0,c.width,c.height);document.getElementById('msg').textContent='Reward revealed!';document.getElementById('claim').disabled=false}}
['mousedown','touchstart'].forEach(v=>c.addEventListener(v,e=>{down=true;move(e)}));['mousemove','touchmove'].forEach(v=>c.addEventListener(v,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(v=>c.addEventListener(v,()=>{down=false;check()}));
document.getElementById('claim').onclick=async()=>{let b=document.getElementById('claim');b.disabled=true;b.textContent='Claiming...';let r=await fetch('/api/scratch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'{{token}}',stage:{{stage}}})}),d=await r.json();if(d.ok){document.getElementById('result').innerHTML=`<div class="success">✅ ₹${d.reward} balance me add ho gaya.<br>${d.next}</div>`;b.textContent='Reward Claimed'}};
</script></body></html>
